[project]
name = "geo-check"
version = "0.1.0"
description = "Check whether a website is reachable and readable by AI crawlers, and score it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vasco Caldeira Branco" }]
keywords = ["geo", "generative-engine-optimization", "ai-crawlers", "robots-txt", "seo", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/Vascobranco2509/geo-check"
Repository = "https://github.com/Vascobranco2509/geo-check"
Issues = "https://github.com/Vascobranco2509/geo-check/issues"
Changelog = "https://github.com/Vascobranco2509/geo-check/blob/main/CHANGELOG.md"
Validation = "https://github.com/Vascobranco2509/geo-check/blob/main/docs/VALIDATION.md"
Rubric = "https://github.com/Vascobranco2509/geo-check/blob/main/docs/RUBRIC.md"

[project.scripts]
geo-check = "geo_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_check"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# The 500 site replay takes minutes and needs fixtures recorded with
# scripts/refresh_fixtures.py. Run it deliberately: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: replays the whole corpus, opt in"]
