# Golden set. Sites verified by hand. 100 percent accuracy is required here.
# Every entry names what makes this site hard.
#
# The expectations are robots.txt derived facts plus the Access score.
# Readability is deliberately absent: it rests on heuristics that will be tuned,
# and a golden set that breaks on every tuning stops being read.
#
# Shapes covered: no robots.txt, robots.txt answering 200 with HTML, blanket
# Disallow, blanket Disallow with named exceptions, wildcards, conflicting Allow
# and Disallow, Cloudflare generated files, llms.txt present, nested sitemap
# indexes, a single page application, training blocked with citation open, and
# four different ways for a run to abort.
#
# Two shapes from the original list are missing, and both absences are findings
# rather than gaps in the search.
#
# Citation blocked with training left open was not found in the 54 site sample.
#
# All six citation crawlers blocked was not found either, because blocking
# Googlebot means leaving classic search as well, and almost nobody does that.
# A mutation test confirmed the consequence: changing CAP_ALL_CITATION_BLOCKED
# does not break any entry here, only the unit tests. The twenty point cap is
# real but it will rarely fire in the wild, which is worth remembering when the
# study reports how many sites are flagged CRITICAL.
#
# Inventing sites to carry either shape would make this file fiction. Both are
# covered by unit tests in tests/test_robots.py and tests/test_checks_access.py.
#
# Regenerate the fixtures with:
#   python scripts/refresh_fixtures.py --out tests/fixtures/golden --only <domains>
# then regenerate this file. Never edit an expectation to make a test pass
# without first checking the robots.txt by hand.

