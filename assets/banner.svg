<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"
     aria-label="geo-check. Check whether a website is reachable and readable by AI crawlers. The New York Times scores 56 out of 100 on Access and 83 out of 100 on Readability.">
  <title>geo-check</title>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
    <style>
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#ground)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#38bdf8"/>

  <!-- name and one line -->
  <text class="mono" x="64" y="118" font-size="54" font-weight="700" fill="#f1f5f9">geo-check</text>
  <text class="sans" x="64" y="164" font-size="21" fill="#94a3b8">Check whether a website is reachable and readable by AI crawlers,</text>
  <text class="sans" x="64" y="194" font-size="21" fill="#94a3b8">and score it.</text>

  <text class="sans" x="64" y="252" font-size="16.5" fill="#64748b">Two scores. Never averaged. Blocking model training costs no points.</text>
  <text class="sans" x="64" y="277" font-size="16.5" fill="#64748b">Validated across 500 real sites. Zero crashes, and three bugs found in itself.</text>

  <!-- the two scores, from the real nytimes.com run -->
  <g transform="translate(700 74)">
    <rect x="0" y="0" width="212" height="172" rx="14" fill="#111c30" stroke="#1e293b" stroke-width="1.5"/>
    <text class="sans" x="24" y="38" font-size="13" letter-spacing="1.6" fill="#94a3b8">ACCESS</text>
    <rect x="154" y="20" width="36" height="26" rx="7" fill="#f59e0b" opacity="0.16"/>
    <text class="mono" x="172" y="39" font-size="17" font-weight="700" fill="#f59e0b" text-anchor="middle">D</text>
    <text class="mono" x="24" y="104" font-size="58" font-weight="700" fill="#f59e0b">56</text>
    <text class="mono" x="106" y="104" font-size="22" fill="#64748b">/100</text>
    <rect x="24" y="126" width="164" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="126" width="92" height="7" rx="3.5" fill="#f59e0b"/>
    <text class="sans" x="24" y="154" font-size="13" fill="#64748b">3 of 6 citation crawlers allowed</text>
  </g>

  <g transform="translate(940 74)">
    <rect x="0" y="0" width="212" height="172" rx="14" fill="#111c30" stroke="#1e293b" stroke-width="1.5"/>
    <text class="sans" x="24" y="38" font-size="13" letter-spacing="1.6" fill="#94a3b8">READABILITY</text>
    <rect x="154" y="20" width="36" height="26" rx="7" fill="#38bdf8" opacity="0.16"/>
    <text class="mono" x="172" y="39" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="middle">B</text>
    <text class="mono" x="24" y="104" font-size="58" font-weight="700" fill="#38bdf8">82</text>
    <text class="mono" x="106" y="104" font-size="22" fill="#64748b">.5/100</text>
    <rect x="24" y="126" width="164" height="7" rx="3.5" fill="#1e293b"/>
    <rect x="24" y="126" width="135" height="7" rx="3.5" fill="#38bdf8"/>
    <text class="sans" x="24" y="154" font-size="13" fill="#64748b">structured, and easy to quote</text>
  </g>

  <text class="sans" x="700" y="277" font-size="14" fill="#64748b">The same site, nytimes.com. An average of 69 would describe neither.</text>
</svg>
